[build-system]
requires = ["flit_core >=3.2,<4"]
build-backend = "flit_core.buildapi"

[project]
name = "aniversariantes_anpla_bot"
version = "0.0.1"
description = "Bot do Telegram voltado para notifica\u00e7\u00f5es de aniversariantes da corretora pelo Telegram e E-mail"
authors = [
  { name = "Yuri Ribeiro" },
]

readme = "README.md"
classifiers = [
    "Programming Language :: Python :: 3",
    
]
requires-python = "~=3.14.0"


[tool.ruff]
line-length = 99
src = ["aniversariantes_anpla_bot"]
include = ["pyproject.toml", "aniversariantes_anpla_bot/**/*.py"]

[tool.ruff.lint]
extend-select = ["I"]  # Add import sorting

[tool.ruff.lint.isort]
known-first-party = ["aniversariantes_anpla_bot"]
force-sort-within-sections = true

